# Firebase App Hosting config. Fill the NEXT_PUBLIC_FIREBASE_* values from Project settings → Your apps (Web).
# They are public web config, safe to commit. DATABASE_URL is a secret: never put it here as a plain value.
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_PROJECT_ID.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_PROJECT_ID
    availability: [BUILD, RUNTIME]

  # Neon pooled connection string for the sprintboard_app role:
  #   firebase apphosting:secrets:set database-url
  - variable: DATABASE_URL
    secret: database-url
  - variable: DATABASE_POOL_MAX
    value: "3"
