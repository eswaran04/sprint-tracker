# Firebase App Hosting config. Fill the NEXT_PUBLIC_FIREBASE_* values from Project settings → Your apps (Web).
# They are public web config, safe to commit. DB_PASS is a secret: never put it here as a plain value.
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCvZPUf842IwnycFCu-HOIt4QwuzrJ34Fc
    availability: [BUILD, RUNTIME]
  # The app's own domain: /__/auth/* is proxied to firebaseapp.com (next.config.ts) so sign-in works on iOS Safari.
  # Its /__/auth/handler must be an authorized redirect URI on the OAuth web client.
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: sprintboard--sprint-tracker-126ab.asia-southeast1.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: sprint-tracker-126ab
    availability: [BUILD, RUNTIME]

  # Cloud SQL Postgres via the Cloud SQL connector (src/lib/db/pool.ts). Instance: "project:region:instance".
  - variable: CLOUD_SQL_INSTANCE
    value: sprint-tracker-126ab:asia-southeast1:sprint-tracker-126ab-instance
  - variable: DB_USER
    value: sprintboard_app
  - variable: DB_NAME
    value: sprintboard
  # Password of sprintboard_app:  firebase apphosting:secrets:set sprintboard-db-pass
  - variable: DB_PASS
    secret: sprintboard-db-pass
  - variable: DATABASE_POOL_MAX
    value: "3"
