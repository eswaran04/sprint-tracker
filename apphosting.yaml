# Firebase App Hosting config. Fill the NEXT_PUBLIC_FIREBASE_* values from Project settings → Your apps (Web).
# They are public web config, safe to commit. DB_PASS is a secret: never put it here as a plain value.
runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_PROJECT_ID.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_PROJECT_ID
    availability: [BUILD, RUNTIME]

  # Cloud SQL Postgres via the Cloud SQL connector (src/lib/db/pool.ts). Instance: "project:region:instance".
  - variable: CLOUD_SQL_INSTANCE
    value: REPLACE_WITH_PROJECT_ID:REPLACE_WITH_REGION:sprintboard
  - variable: DB_USER
    value: sprintboard_app
  - variable: DB_NAME
    value: sprintboard
  # Password of sprintboard_app:  firebase apphosting:secrets:set sprintboard-db-pass
  - variable: DB_PASS
    secret: sprintboard-db-pass
  - variable: DATABASE_POOL_MAX
    value: "3"
